<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>自助洗衣店排程模擬器 | Max-Heap 優先排程與冷卻管理</title>
    <style>
        /* ----- 全域柔和現代風格 ----- */
        :root {
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            --color-text-primary: #1e2f3c;
            --color-text-secondary: #4e6b82;
            --color-text-tertiary: #7c9ab3;
            --color-background-primary: #ffffff;
            --color-background-secondary: #f8fbfe;
            --color-border-secondary: #e2edf5;
            --color-border-tertiary: #d0e0ec;
            --border-radius-md: 20px;
            --border-radius-lg: 28px;
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 14px 28px rgba(0, 0, 0, 0.05);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-text-primary: #eef2f8;
                --color-text-secondary: #b9d0ed;
                --color-text-tertiary: #89abc9;
                --color-background-primary: #0f1824;
                --color-background-secondary: #1a2a3c;
                --color-border-secondary: #2a4054;
                --color-border-tertiary: #2e4a66;
                --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.4);
                --shadow-md: 0 16px 28px rgba(0, 0, 0, 0.6);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(145deg, #eef3fa 0%, #e4edf6 100%);
            color: var(--color-text-primary);
            padding: 1.6rem 1.2rem;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(145deg, #0e1723 0%, #0c1621 100%);
            }
        }

        .w {
            max-width: 1380px;
            margin: 0 auto;
            padding: 0 0 1.8rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
        }

        /* 控制列 膠囊現代感 */
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--color-background-primary);
            backdrop-filter: blur(8px);
            padding: 10px 26px;
            border-radius: 60px;
            box-shadow: var(--shadow-sm);
            border: 0.5px solid var(--color-border-tertiary);
        }
        .row label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--color-background-secondary);
            padding: 4px 18px 4px 20px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }
        .row input[type="number"] {
            width: 64px;
            padding: 6px 8px;
            border: 1px solid var(--color-border-tertiary);
            border-radius: 48px;
            background: var(--color-background-primary);
            color: var(--color-text-primary);
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
            transition: 0.2s;
        }
        .row input:focus {
            outline: none;
            border-color: #534AB7;
            box-shadow: 0 0 0 2px rgba(83,74,183,0.2);
        }
        .btn {
            padding: 6px 18px;
            border: none;
            border-radius: 40px;
            background: var(--color-background-secondary);
            color: var(--color-text-primary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
            border: 0.5px solid var(--color-border-tertiary);
            font-family: inherit;
        }
        .btn:hover {
            background: #e2edf8;
            transform: translateY(-1px);
        }
        .btn.p {
            background: #534AB7;
            border: none;
            color: white;
            box-shadow: 0 4px 12px rgba(83,74,183,0.3);
        }
        .btn.p:hover {
            background: #413a91;
            transform: scale(0.98);
        }
        @media (prefers-color-scheme: dark) {
            .btn:hover { background: #2c4b6e; }
            .btn.p { background: #6b5ed6; }
            .btn.p:hover { background: #5248b3; }
        }

        /* 統計卡片 */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 1.8rem;
        }
        .sc {
            background: var(--color-background-primary);
            backdrop-filter: blur(6px);
            border-radius: 34px;
            padding: 18px 16px;
            box-shadow: var(--shadow-md);
            border: 0.5px solid var(--color-border-tertiary);
            transition: all 0.2s;
        }
        .sc:hover {
            transform: translateY(-3px);
        }
        .sc .lb {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: var(--color-text-tertiary);
            margin-bottom: 8px;
        }
        .sc .vl {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .vg { color: #1D9E75; }
        .vr { color: #e76f51; }
        .vb { color: #378ADD; }
        .vp { color: #534AB7; }
        @media (prefers-color-scheme: dark) {
            .vg { color: #6bc2a5; }
            .vr { color: #f4a261; }
            .vb { color: #60a5fa; }
            .vp { color: #9f93f0; }
        }

        /* 提示訊息 */
        .note {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            padding: 12px 20px;
            border-radius: 40px;
            background: var(--color-background-primary);
            border-left: 5px solid #534AB7;
            margin-bottom: 1.2rem;
            box-shadow: var(--shadow-sm);
            font-weight: 500;
        }

        /* 三欄結構 */
        .three {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 1.8rem;
        }
        .pnl {
            background: var(--color-background-primary);
            border-radius: 34px;
            box-shadow: var(--shadow-md);
            border: 0.5px solid var(--color-border-tertiary);
            overflow: hidden;
        }
        .ph {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--color-text-secondary);
            padding: 14px 20px;
            background: rgba(0,0,0,0.02);
            border-bottom: 1px solid var(--color-border-tertiary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #l-heap, #l-queue, #l-done-list {
            max-height: 280px;
            overflow-y: auto;
            padding: 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* 滾動條 */
        #l-heap::-webkit-scrollbar, #l-queue::-webkit-scrollbar, #l-done-list::-webkit-scrollbar {
            width: 5px;
        }
        #l-heap::-webkit-scrollbar-track, #l-queue::-webkit-scrollbar-track, #l-done-list::-webkit-scrollbar-track {
            background: transparent;
        }
        #l-heap::-webkit-scrollbar-thumb {
            background: var(--color-text-tertiary);
            border-radius: 12px;
        }

        /* 等候佇列卡片 */
        .c-item {
            padding: 10px 14px;
            border-radius: 28px;
            border: 0.5px solid var(--color-border-tertiary);
            background: var(--color-background-secondary);
            font-size: 0.75rem;
            transition: 0.1s;
        }
        .c-item.top {
            border-left: 4px solid #534AB7;
            background: rgba(83,74,183,0.08);
        }
        .c-item .cn {
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 0.8rem;
        }
        .c-item .cd {
            color: var(--color-text-tertiary);
            font-size: 0.7rem;
            margin-bottom: 2px;
        }
        .c-item .cp {
            font-size: 0.7rem;
            font-weight: 600;
            color: #534AB7;
        }

        /* 冷卻佇列 */
        .m-item {
            padding: 10px 14px;
            border-radius: 28px;
            border: 1px solid var(--color-border-tertiary);
            background: var(--color-background-secondary);
            font-size: 0.75rem;
            transition: 0.1s;
        }
        .m-item.ready {
            border-color: #1D9E75;
            background: rgba(29,158,117,0.1);
            box-shadow: 0 0 0 1px rgba(29,158,117,0.15);
        }
        /* 已完成清單 */
        #l-done-list > div {
            padding: 8px 14px;
            font-size: 0.75rem;
            border-bottom: 0.5px solid var(--color-border-tertiary);
            background: var(--color-background-secondary);
            border-radius: 24px;
        }

        /* 機台網格 */
        .machine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 16px;
            margin-bottom: 1.8rem;
        }
        .machine {
            background: var(--color-background-primary);
            border-radius: 28px;
            padding: 14px 8px;
            text-align: center;
            border: 0.5px solid var(--color-border-tertiary);
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }
        .machine.active {
            background: #EEEDFE;
            border-color: #AFA9EC;
            color: #2b2680;
            transform: scale(1.01);
        }
        .machine.cooling {
            background: #FAEEDA;
            border-color: #FAC775;
            color: #ad6c19;
        }
        .machine.idle2 {
            background: var(--color-background-secondary);
            color: var(--color-text-secondary);
        }
        @media (prefers-color-scheme: dark) {
            .machine.active { background: #2d2a63; border-color: #8b83d4; color: #e0dbff; }
            .machine.cooling { background: #5f4517; border-color: #d99f32; color: #ffdfa5; }
        }
        .machine .mi {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 6px;
            line-height: 1;
        }
        .machine .ml {
            font-weight: 600;
            font-size: 0.8rem;
        }
        .machine .ms {
            font-size: 0.7rem;
            margin-top: 6px;
            font-weight: 500;
            color: var(--color-text-tertiary);
        }
    </style>
</head>
<body>
<div class="w">
<h2 class="sr-only">自助洗衣店排程模擬器：Max-Heap 按優先值安排洗衣順序，機器清洗冷卻以 Queue 管理</h2>

<div class="row">
  <label>👥 客人數 <input type="number" id="nCust" min="4" max="40" value="12"></label>
  <label>🧺 洗衣機台數 <input type="number" id="nMach" min="1" max="6" value="3"></label>
  <label>❄️ 清洗冷卻 <input type="number" id="cdMach" min="1" max="6" value="2"></label>
  <button class="btn p" onclick="runLaundry()">✨ 新模擬</button>
  <button class="btn" onclick="stepL(-1)">◀ 上步</button>
  <button class="btn" onclick="stepL(1)">下步 ▶</button>
  <button class="btn" onclick="stepL(9999)">⏭ 完成</button>
</div>

<div class="stats">
  <div class="sc"><div class="lb">📋 總客人</div><div class="vl vb" id="l-total">-</div></div>
  <div class="sc"><div class="lb">✅ 已完成</div><div class="vl vg" id="l-done">-</div></div>
  <div class="sc"><div class="lb">⚙️ 機台閒置</div><div class="vl vr" id="l-idle">-</div></div>
  <div class="sc"><div class="lb">📈 機台稼動率</div><div class="vl vp" id="l-util">-</div></div>
</div>

<div class="note" id="l-note">🧼 按「新模擬」開始洗衣排程</div>

<div id="machine-grid" class="machine-grid"></div>

<div class="three">
  <div class="pnl">
    <div class="ph">📌 Max-Heap 候洗佇列（優先值↓）</div>
    <div id="l-heap"></div>
  </div>
  <div class="pnl">
    <div class="ph">🌀 清洗冷卻 Queue (FIFO)</div>
    <div id="l-queue"></div>
  </div>
  <div class="pnl">
    <div class="ph">🏆 已完成洗衣項目</div>
    <div id="l-done-list"></div>
  </div>
</div>
</div>

<script>
    // ========== 原始邏輯完全保留，僅外觀美化，演算法未更動 ==========
    const CNAMES=['小明','阿花','老李','陳媽媽','大雄','靜香','胖虎','小夫','藤木','出木杉','阿義','翠花','春嬌','志明','小美','阿强','阿龍','秀蘭','建國','麗麗'];
    const TYPES=['棉質衣物','牛仔褲','床單被套','運動服','嬰兒衣物','絲綢禮服','厚外套','窗簾'];

    let lSteps=[], lCur=0, nMachG=3;

    class MaxHeap3{
      constructor(){this.h=[]}
      push(it){this.h.push(it);this._up(this.h.length-1)}
      pop(){if(!this.h.length)return null;let t=this.h[0];let l=this.h.pop();if(this.h.length){this.h[0]=l;this._dn(0)}return t}
      get size(){return this.h.length}
      _up(i){while(i>0){let p=(i-1)>>1;if(this.h[p].priority>=this.h[i].priority)break;[this.h[p],this.h[i]]=[this.h[i],this.h[p]];i=p}}
      _dn(i){let n=this.h.length;while(true){let s=i,l=2*i+1,r=2*i+2;if(l<n&&this.h[l].priority>this.h[s].priority)s=l;if(r<n&&this.h[r].priority>this.h[s].priority)s=r;if(s===i)break;[this.h[s],this.h[i]]=[this.h[i],this.h[s]];i=s}}
    }

    function runLaundry(){
      let nCust=Math.min(40,Math.max(4,parseInt(document.getElementById('nCust').value)||12));
      let nMach=Math.min(6,Math.max(1,parseInt(document.getElementById('nMach').value)||3));
      let cd=Math.min(6,Math.max(1,parseInt(document.getElementById('cdMach').value)||2));
      nMachG=nMach;

      let customers=[];
      for(let i=0;i<nCust;i++){
        let name=CNAMES[i%CNAMES.length];
        let type=TYPES[Math.floor(Math.random()*TYPES.length)];
        let waitMin=Math.floor(Math.random()*30)+5;
        let kg=Math.floor(Math.random()*8)+2;
        let priority=waitMin*2+kg*5;
        customers.push({id:i+1,name,type,waitMin,kg,priority});
      }

      let heap=new MaxHeap3();
      for(let c of customers) heap.push({...c});

      let coolQ=[];
      let machineState=Array(nMach).fill(null).map((_,i)=>({id:i+1,status:'idle',task:null,coolEnd:0}));
      let time=0,idle=0,done=0;
      let steps=[];
      let doneList=[];

      let maxT=nCust*(cd+1)*nMach+100;
      while((heap.size>0||coolQ.length>0)&&time<maxT){
        for(let [rt,,cust] of coolQ.filter(([rt])=>rt<=time)) heap.push({...cust});
        coolQ=coolQ.filter(([rt])=>rt>time);

        let heapSnap=heap.h.map(x=>({...x}));
        let qSnap=coolQ.map(x=>[...x]);

        if(heap.size>0){
          let c=heap.pop();
          coolQ.push([time+cd+1,'mach',{...c}]);
          done++;
          doneList.push({...c});
          steps.push({time,idle,done,action:`洗衣機啟動：${c.name} 的 ${c.type}（${c.kg}kg，等待${c.waitMin}分）`,isIdle:false,heap:heapSnap,queue:qSnap,doneList:[...doneList]});
        } else {
          idle++;
          steps.push({time,idle,done,action:'等待機台清洗完成（Idle）',isIdle:true,heap:heapSnap,queue:qSnap,doneList:[...doneList]});
        }
        time++;
      }

      lSteps=steps;
      lCur=0;
      document.getElementById('l-total').textContent=nCust;
      renderMachineGrid(nMach);
      renderLStep();
    }

    function renderMachineGrid(n){
      let g=document.getElementById('machine-grid');
      g.innerHTML=Array(n).fill(0).map((_,i)=>`
        <div class="machine idle2" id="mach-${i}">
          <span class="mi">🧺</span>
          <div class="ml">機台 ${i+1}</div>
          <div class="ms" id="mach-s-${i}">待機</div>
        </div>`).join('');
    }

    function stepL(d){
      if(!lSteps.length)return;
      if(d===9999)lCur=lSteps.length-1;
      else lCur=Math.max(0,Math.min(lSteps.length-1,lCur+d));
      renderLStep();
    }

    function renderLStep(){
      if(!lSteps.length)return;
      let s=lSteps[lCur];
      document.getElementById('l-done').textContent=s.done;
      document.getElementById('l-idle').textContent=s.idle;
      let util=s.time>0?((s.time-s.idle)/s.time*100).toFixed(1)+'%':'—';
      document.getElementById('l-util').textContent=util;
      document.getElementById('l-note').innerHTML=`⏱️ 時間 T${s.time}：${s.action}  &nbsp;&nbsp;📌 步驟 ${lCur+1}/${lSteps.length}`;

      let hl=document.getElementById('l-heap');
      hl.innerHTML=s.heap.length===0?'<div style="font-size:12px;color:var(--color-text-tertiary);padding:12px;text-align:center;">🧼 無待洗衣物</div>':
        s.heap.map((c,i)=>`
          <div class="c-item${i===0?' top':''}">
            <div class="cn">${c.name} — ${c.type}</div>
            <div class="cd">⚖️ ${c.kg}kg · 等待 ${c.waitMin} 分鐘</div>
            <div class="cp">🔥 優先值 ${c.priority}</div>
          </div>`).join('');

      let ql=document.getElementById('l-queue');
      ql.innerHTML=s.queue.length===0?'<div style="font-size:12px;color:var(--color-text-tertiary);padding:12px;text-align:center;">♻️ 冷卻佇列為空</div>':
        s.queue.map(([rt,,c])=>`
          <div class="m-item${rt<=s.time?' ready':''}">
            <div style="font-weight:600; font-size:0.8rem;">${c.name} 的 ${c.type}</div>
            <div style="font-size:0.7rem;color:var(--color-text-tertiary); margin-top:2px;">${rt<=s.time?'✅ 清洗完成，可使用':'⏳ 冷卻中，解凍 @T'+rt}</div>
          </div>`).join('');

      let dl=document.getElementById('l-done-list');
      dl.innerHTML=s.doneList.length===0?'<div style="font-size:12px;color:var(--color-text-tertiary);padding:12px;text-align:center;">✨ 尚無完成項目</div>':
        s.doneList.slice().reverse().map(c=>`
          <div style="padding:8px 12px; font-size:0.75rem; border-bottom:0.5px solid var(--color-border-tertiary); background:var(--color-background-secondary); border-radius:24px; margin-bottom:4px;">
            <span style="font-weight:700;">${c.name}</span> — ${c.type}  <span style="color:var(--color-text-tertiary);">${c.kg}kg</span>
          </div>`).join('');

      for(let i=0;i<nMachG;i++){
        let el=document.getElementById('mach-'+i);
        let sl=document.getElementById('mach-s-'+i);
        if(!el) continue;
        let inUse = !s.isIdle && i===0;
        let inCool = s.queue.some(([rt,_,c], idx) => idx===i && rt>s.time);
        if(inCool){
          el.className='machine cooling';
          sl.textContent='❄️ 冷卻中';
        } else if(inUse){
          el.className='machine active';
          sl.textContent='🧺 洗衣中';
        } else {
          el.className='machine idle2';
          sl.textContent='⚡ 待機';
        }
      }
      s.queue.forEach(([rt,,c],qi)=>{
        let mi=document.getElementById('mach-'+qi);
        let ms=document.getElementById('mach-s-'+qi);
        if(mi&&ms && rt>s.time){
          mi.className='machine cooling';
          ms.textContent='❄️ 冷卻中';
        }
      });
    }

    runLaundry();
</script>
</body>
</html>
